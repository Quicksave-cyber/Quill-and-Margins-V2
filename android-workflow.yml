name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect web files
        run: |
          mkdir -p www assets
          cp index.html style.css app.js firebase-config.js manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Add Android project
        run: npx cap add android

      - name: App icons
        run: npx capacitor-assets generate --android || echo "icon generation skipped"

      - name: Sync
        run: npx cap sync android

      - name: Google services file
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; else echo "google-services.json missing: Google sign-in will not work"; fi

      - name: Notification permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M

      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: quill-and-margin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
